services:
  voice-rep-counter-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-rep-counter-site
    restart: unless-stopped
    ports:
      # Bound to loopback only; the host reverse proxy forwards public HTTPS here.
      - "127.0.0.1:8085:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
